name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm rebuild
          npm run build

      - name: Setup Capacitor & Inject Background Audio Permissions
        run: |
          npm install @capacitor/core @capacitor/app @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init AbirTune com.abirtune.app --web-dir dist || true
          npx cap add android || true
          
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Manifest found, ensuring permissions..."
          fi
          
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
