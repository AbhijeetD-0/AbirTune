name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clean Install & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Force Rebuild Android & Generate APK
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/app@latest --legacy-peer-deps
          
          rm -rf android
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          
          # यह कमांड Gradle के डाउनलोड टाइमआउट और कनेक्शन रिसेट की समस्या को हमेशा के लिए रोक देगी
          ./gradlew wrapper --gradle-version 8.8
          
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --offline

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
